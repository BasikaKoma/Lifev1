<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" fill="none">
  <defs>
    <linearGradient id="bodyFill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.09)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <radialGradient id="chestLight" cx="42%" cy="36%" r="32%">
      <stop offset="0%" stop-color="rgba(16,185,129,0.55)"/>
      <stop offset="70%" stop-color="rgba(16,185,129,0.12)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <radialGradient id="headLight" cx="58%" cy="8%" r="26%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.48)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
    <radialGradient id="shoulderLight" cx="65%" cy="18%" r="20%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.25)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <ellipse cx="175" cy="668" rx="100" ry="14" fill="rgba(16,185,129,0.08)" filter="url(#softGlow)"/>

