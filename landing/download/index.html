<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download — lifev1</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page page--auth">
      <div class="page__glow" aria-hidden="true"></div>

      <header class="header">
        <div class="container header__inner">
          <a class="logo" href="/" aria-label="lifev1 home">
            <svg class="logo__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#0a0a0a" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
              <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34d399">v1</text>
            </svg>
            <span class="logo__text">life<em>v1</em></span>
          </a>
          <nav class="nav" aria-label="Main">
            <a href="/">Home</a>
            <button type="button" class="auth__link nav__signout" id="sign-out" hidden>Sign out</button>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container auth">
          <div class="auth__card download-card" id="download-card" hidden>
            <p class="auth__eyebrow">Desktop app</p>
            <h1 class="auth__title">Download lifev1</h1>
            <p class="auth__lead">
              Signed in as <strong id="user-email"></strong>
            </p>

            <div class="download-card__meta" id="release-meta"></div>

            <a class="btn btn--primary btn--block" id="download-btn" href="#" download>
              Download for Windows
            </a>

            <p class="auth__note">Requires Windows 10 or later. Auto-updates are enabled after install.</p>
          </div>

          <div class="auth__card" id="loading-card">
            <p class="auth__lead">Loading…</p>
          </div>

          <div class="auth__card" id="error-card" hidden>
            <p class="auth__eyebrow">Download</p>
            <h1 class="auth__title">Not available yet</h1>
            <p class="auth__lead" id="error-message"></p>
            <a class="btn btn--ghost btn--block" href="mailto:hello@lifev1.com">Contact support</a>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container footer__inner">
          <span>&copy; <span id="year"></span> lifev1.com</span>
          <div class="footer__links">
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Service</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="/js/config.js"></script>
    <script type="module">
      import { requireAuth, signOut, fetchLatestInstaller } from '/js/site.js';

      document.getElementById('year').textContent = new Date().getFullYear();

      const loadingCard = document.getElementById('loading-card');
      const downloadCard = document.getElementById('download-card');
      const errorCard = document.getElementById('error-card');
      const errorMessage = document.getElementById('error-message');
      const userEmail = document.getElementById('user-email');
      const releaseMeta = document.getElementById('release-meta');
      const downloadBtn = document.getElementById('download-btn');
      const signOutBtn = document.getElementById('sign-out');

      signOutBtn.addEventListener('click', async () => {
        await signOut();
        window.location.href = '/login';
      });

      async function init() {
        const user = await requireAuth('/login');
        if (!user) return;

        signOutBtn.hidden = false;
        userEmail.textContent = user.email;

        try {
          const release = await fetchLatestInstaller();
          releaseMeta.innerHTML = `
            <div class="download-card__row">
              <span>Version</span>
              <strong>${release.version}</strong>
            </div>
            <div class="download-card__row">
              <span>File</span>
              <strong>${release.name}</strong>
            </div>
            ${release.sizeMb ? `<div class="download-card__row"><span>Size</span><strong>${release.sizeMb} MB</strong></div>` : ''}
          `;
          downloadBtn.href = release.url;
          downloadBtn.setAttribute('download', release.name);
          loadingCard.hidden = true;
          downloadCard.hidden = false;
        } catch (error) {
          loadingCard.hidden = true;
          errorMessage.textContent = error.message || 'Could not load the installer.';
          errorCard.hidden = false;
        }
      }

      init();
    </script>
  </body>
</html>
