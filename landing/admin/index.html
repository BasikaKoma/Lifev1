<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — lifev1</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page page--account">
      <div class="page__glow" aria-hidden="true"></div>
      <div class="page__grid" aria-hidden="true"></div>

      <header class="header">
        <div class="container header__inner">
          <a class="logo" href="/" aria-label="lifev1 home">
            <svg class="logo__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#0a0a0a" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
              <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34d399">v1</text>
            </svg>
            <span class="logo__text">life<em>v1</em></span>
          </a>
          <nav class="nav" aria-label="Main">
            <a href="/account">Account</a>
            <a href="/admin" aria-current="page">Admin</a>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container admin-page">
          <div class="account-page__header">
            <div>
              <p class="account-brand__eyebrow">Admin panel</p>
              <h1 class="account-page__title">User activity</h1>
            </div>
            <button type="button" class="btn btn--ghost btn--sm" id="sign-out">Sign out</button>
          </div>

          <div class="account-panel__loading" id="admin-loading">
            <div class="account-spinner" aria-hidden="true"></div>
            <p>Loading admin data…</p>
          </div>

          <div id="admin-denied" class="account-error glass" hidden>
            <p class="account-message account-message--error">You do not have access to this page.</p>
            <a class="btn btn--ghost btn--block" href="/account">Back to account</a>
          </div>

          <div id="admin-content" hidden>
            <div class="admin-stats">
              <article class="admin-stat glass">
                <p>Total users</p>
                <strong id="stat-users">0</strong>
              </article>
              <article class="admin-stat glass">
                <p>Total logins</p>
                <strong id="stat-logins">0</strong>
              </article>
              <article class="admin-stat glass">
                <p>Users with download</p>
                <strong id="stat-downloads">0</strong>
              </article>
            </div>

            <section class="admin-section glass">
              <h2>Users</h2>
              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>Email</th>
                      <th>Registered</th>
                      <th>Last login</th>
                      <th>Logins</th>
                      <th>Downloaded</th>
                      <th>Last download</th>
                    </tr>
                  </thead>
                  <tbody id="users-body"></tbody>
                </table>
              </div>
            </section>

            <section class="admin-section glass">
              <h2>Recent activity</h2>
              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>When</th>
                      <th>Email</th>
                      <th>Event</th>
                    </tr>
                  </thead>
                  <tbody id="events-body"></tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container footer__inner">
          <span>&copy; <span id="year"></span> lifev1.com</span>
        </div>
      </footer>
    </div>

    <script src="/js/config.js"></script>
    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
