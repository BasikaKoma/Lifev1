<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — lifev1</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page page--auth">
      <div class="page__glow" aria-hidden="true"></div>

      <header class="header">
        <div class="container header__inner">
          <a class="logo" href="/" aria-label="lifev1 home">
            <svg class="logo__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#0a0a0a" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
              <text x="16" y="21" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34d399">v1</text>
            </svg>
            <span class="logo__text">life<em>v1</em></span>
          </a>
          <nav class="nav" aria-label="Main">
            <a href="/">Home</a>
            <a href="/download">Download</a>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container auth">
          <div class="auth__card">
            <p class="auth__eyebrow">Account</p>
            <h1 class="auth__title" id="auth-title">Sign in</h1>
            <p class="auth__lead" id="auth-lead">Sign in to download the lifev1 desktop app.</p>

            <form class="auth__form" id="auth-form">
              <label class="field">
                <span class="field__label">Email</span>
                <input class="field__input" type="email" name="email" autocomplete="email" required />
              </label>
              <label class="field">
                <span class="field__label">Password</span>
                <input class="field__input" type="password" name="password" autocomplete="current-password" minlength="6" required />
              </label>
              <p class="auth__message auth__message--error" id="auth-error" hidden></p>
              <p class="auth__message auth__message--info" id="auth-info" hidden></p>
              <button class="btn btn--primary btn--block" type="submit" id="auth-submit">Sign in</button>
            </form>

            <p class="auth__switch">
              <span id="auth-switch-text">Don't have an account?</span>
              <button type="button" class="auth__link" id="auth-toggle">Create one</button>
            </p>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container footer__inner">
          <span>&copy; <span id="year"></span> lifev1.com</span>
          <div class="footer__links">
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Service</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="/js/config.js"></script>
    <script type="module">
      import { getUser, signIn, signUp, formatAuthError } from '/js/site.js';

      document.getElementById('year').textContent = new Date().getFullYear();

      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('next') || '/download';
      let mode = 'signin';

      const form = document.getElementById('auth-form');
      const title = document.getElementById('auth-title');
      const lead = document.getElementById('auth-lead');
      const submit = document.getElementById('auth-submit');
      const toggle = document.getElementById('auth-toggle');
      const switchText = document.getElementById('auth-switch-text');
      const errorEl = document.getElementById('auth-error');
      const infoEl = document.getElementById('auth-info');

      function setMode(nextMode) {
        mode = nextMode;
        const isSignIn = mode === 'signin';
        title.textContent = isSignIn ? 'Sign in' : 'Create account';
        lead.textContent = isSignIn
          ? 'Sign in to download the lifev1 desktop app.'
          : 'Create an account to access the desktop app.';
        submit.textContent = isSignIn ? 'Sign in' : 'Create account';
        switchText.textContent = isSignIn ? "Don't have an account?" : 'Already have an account?';
        toggle.textContent = isSignIn ? 'Create one' : 'Sign in';
        errorEl.hidden = true;
        infoEl.hidden = true;
      }

      toggle.addEventListener('click', () => {
        setMode(mode === 'signin' ? 'signup' : 'signin');
      });

      getUser().then((user) => {
        if (user) window.location.href = nextUrl;
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        infoEl.hidden = true;
        submit.disabled = true;

        const data = new FormData(form);
        const email = data.get('email');
        const password = data.get('password');

        try {
          if (mode === 'signup') {
            const result = await signUp(email, password);
            if (!result.session) {
              infoEl.textContent = 'Check your email to confirm your account, then sign in.';
              infoEl.hidden = false;
              setMode('signin');
              return;
            }
          } else {
            await signIn(email, password);
          }
          window.location.href = nextUrl;
        } catch (error) {
          errorEl.textContent = formatAuthError(error);
          errorEl.hidden = false;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
